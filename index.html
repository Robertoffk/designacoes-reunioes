<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Designações — Reunião de Meio de Semana</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#252525}.pagina{max-width:720px;margin:auto;background:#fff;min-height:100vh;padding-bottom:32px}.topo{padding:24px 18px 17px;text-align:center;border-bottom:1px solid #ddd}.topo h1{margin:0 0 7px;font-size:22px}.data{font-size:17px;font-weight:600;color:#555}.seletor{padding:17px 18px;background:#fafafa;border-bottom:1px solid #ddd}.seletor label{display:block;margin-bottom:7px;font-size:14px;font-weight:bold}select{width:100%;padding:11px;font-size:16px;border:1px solid #bbb;border-radius:6px;background:#fff}.conteudo{padding:18px}.conducao{margin-bottom:22px;line-height:1.85}.secao{margin-top:21px;border:1px solid #ddd;border-radius:7px;overflow:hidden}.titulo{padding:10px 12px;font-weight:700;font-size:15px}.tesouros{background:#fff;color:#286477;border-bottom:2px solid #286477}.ministerio{background:#c69b42;color:#222}.vida{background:#7b2638;color:#fff}.operacional{background:#5f6b72;color:#fff}.linha{display:grid;grid-template-columns:1fr;gap:4px;padding:11px 12px;border-top:1px solid #e2e2e2}.tesouros+.linha{border-top:0}.parte{font-size:14px;color:#555}.nome{font-size:16px;font-weight:600}.secundario{margin-top:3px;font-size:14px;color:#666}.vazio{color:#999;font-weight:400}footer{text-align:center;padding:28px 15px 4px;font-size:12px;color:#888}@media(min-width:600px){.linha{grid-template-columns:1.4fr 1fr;align-items:center}}</style></head><body><div class="pagina"><div class="topo"><h1>Reunião de Meio de Semana</h1><div class="data" id="dataTopo"></div></div><div class="seletor"><label for="reuniao">Escolha a data da reunião:</label><select id="reuniao"></select></div><div class="conteudo" id="conteudo"></div></div><script>const reunioes=[{data:"30/09/2026",presidente:"Alceu Lima",oracao_inicial:"Benedito Olegário",oracao_final:"Derek Gadonski",tesouros:[{numero:1,titulo:"Discurso 10 min",nome:"Diogo Halgren"},{numero:2,titulo:"Joias espirituais",nome:"Eduardo Simas"},{numero:3,titulo:"Leitura da Bíblia",nome:"Alexandro Braga"}],fsm:[{numero:4,tipo:"Demonstração",designado:"Cláudio Reis",ajudante:"Gustavo Sgarbossa"},{numero:5,tipo:"Demonstração",designado:"Ivete Santos",ajudante:"Janete Camargo"},{numero:6,tipo:"Demonstração",designado:"Laís Santos",ajudante:"Lucy Simas"}],nvc:[{numero:7,titulo:"Nossa Vida Cristã — Parte 1",nome:"Fernando Chaves"}],estudo:{numero:8,nome:"Luz Agapito",leitor:"Evandro Araújo"},operacional:[["Microfone 1","Jefferson Santos"],["Microfone 2","Laércio Ferreira"],["Indicador 1","Mário Machoski"],["Indicador 2","Ney José"],["Anfitrião / Zoom","Oldir Pereira"],["Mesa de som","Roberto Klabunde"]] },{data:"07/10/2026",presidente:"Benedito Olegário",oracao_inicial:"Alceu Lima",oracao_final:"Diogo Halgren",tesouros:[{numero:1,titulo:"Discurso 10 min",nome:"Derek Gadonski"},{numero:2,titulo:"Joias espirituais",nome:"Evandro Araújo"},{numero:3,titulo:"Leitura da Bíblia",nome:"Cláudio Reis"}],fsm:[{numero:4,tipo:"Demonstração",designado:"Alexandro Braga",ajudante:"Oldir Pereira"},{numero:5,tipo:"Demonstração",designado:"Gustavo Sgarbossa",ajudante:"Vítor Gabriel"},{numero:6,tipo:"Demonstração",designado:"Ivete Santos",ajudante:"Janete Camargo"}],nvc:[{numero:7,titulo:"Nossa Vida Cristã — Parte 1",nome:"Eduardo Simas"}],estudo:{numero:8,nome:"Fernando Chaves",leitor:"Jefferson Santos"},operacional:[["Microfone 1","Laércio Ferreira"],["Microfone 2","Mário Machoski"],["Indicador 1","Luz Agapito"],["Indicador 2","Osmair Santos"],["Anfitrião / Zoom","Roberto Klabunde"],["Mesa de som",""]] }];const $=id=>document.getElementById(id);const em={38:'&amp;',60:'&lt;',62:'&gt;',34:'&quot;',39:'&#039;'};const esc=s=>String(s).replace(/[&<>\x22\x27]/g,c=>em[c.charCodeAt(0)]);const nome=v=>v?esc(v):'<span class="vazio">—</span>';function linha(p,n,e=''){return '<div class="linha"><div class="parte">'+p+'</div><div><div class="nome">'+nome(n)+'</div>'+e+'</div></div>'}function mostrar(i){const r=reunioes[i];if(!r)return;$('dataTopo').textContent='Quarta-feira — '+r.data;let h='<div class="conducao"><div><strong>Presidente:</strong> '+nome(r.presidente)+'</div><div><strong>Oração inicial:</strong> '+nome(r.oracao_inicial)+'</div><div><strong>Oração final:</strong> '+nome(r.oracao_final)+'</div></div>';h+='<div class="secao"><div class="titulo tesouros">TESOUROS DA PALAVRA DE DEUS</div>';r.tesouros.forEach(x=>h+=linha(x.numero+' — '+esc(x.titulo),x.nome));h+='</div><div class="secao"><div class="titulo ministerio">FAÇA SEU MELHOR NO MINISTÉRIO</div>';r.fsm.forEach(x=>{let e=x.tipo?'<div class="secundario">'+esc(x.tipo)+'</div>':'';if(x.ajudante)e+='<div class="secundario">Ajudante: '+esc(x.ajudante)+'</div>';h+=linha(x.numero+' — Designação nº '+x.numero,x.designado,e)});h+='</div><div class="secao"><div class="titulo vida">NOSSA VIDA CRISTÃ</div>';r.nvc.forEach(x=>h+=linha(x.numero+' — '+esc(x.titulo),x.nome));let ex=r.estudo.leitor?'<div class="secundario">Leitor: '+esc(r.estudo.leitor)+'</div>':'';h+=linha(r.estudo.numero+' — Estudo Bíblico de Congregação',r.estudo.nome,ex)+'</div><div class="secao"><div class="titulo operacional">FUNÇÕES OPERACIONAIS</div>';r.operacional.forEach(x=>h+=linha(esc(x[0]),x[1]));h+='</div><footer>Designações da Reunião de Meio de Semana</footer>';$('conteudo').innerHTML=h}if(reunioes.length){reunioes.forEach((r,i)=>{let o=document.createElement('option');o.value=i;o.textContent=r.data;$('reuniao').appendChild(o)});$('reuniao').addEventListener('change',e=>mostrar(Number(e.target.value)));mostrar(0)}else{$('dataTopo').textContent='Nenhuma reunião publicada';$('conteudo').innerHTML='<p>Não há designações preenchidas para publicação.</p>'}</script></body></html>
